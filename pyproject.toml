[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scp-plot"
version = "0.0.1.dev0"
description = "SCP's plotting grammar for scanpy — AnnData-native ports of the R package SCP's figures"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md", "COPYING"]
authors = [{ name = "Hamid Ghaedi" }]
keywords = ["single-cell", "scanpy", "anndata", "visualization", "scRNA-seq"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
  "anndata>=0.10",
  "matplotlib>=3.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Clustering / smoothing backends used by the heatmap and trajectory families.
stats = ["scikit-learn>=1.3", "scikit-misc>=0.3"]
gam = ["pygam>=0.9"]                      # dynamic_heatmap / dynamic_plot
graph = ["python-igraph>=0.11"]          # network / enrichmap layouts
interactive = ["plotly>=5.18"]
fuzzy = ["scikit-fuzzy>=0.4"]             # split_method="mfuzz"
all = ["scp-plot[stats,gam,graph,interactive,fuzzy]"]
dev = [
  "scp-plot[stats,gam,graph,interactive,fuzzy]",
  "pytest>=8.0",
  "pytest-mpl>=0.17",
  "scanpy>=1.10",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/hamidghaedi/pySCP"
Repository = "https://github.com/hamidghaedi/pySCP"
Issues = "https://github.com/hamidghaedi/pySCP/issues"
"Upstream R package" = "https://github.com/zhanghao-njmu/SCP"

[tool.hatch.build.targets.wheel]
packages = ["src/scp"]

[tool.hatch.build.targets.wheel.force-include]
"src/scp/data/palette_list.json" = "scp/data/palette_list.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks group their imports and place them after cell magics, which is
# normal there and not worth contorting to satisfy the library's rules.
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A one-off XDR reader, run once to produce data/palette_list.json and not part
# of the package. Deliberately compact; reformatting it buys nothing and it has
# no tests to catch a mistake.
"tools/_rds.py" = ["E401", "E701", "E702"]

[tool.mypy]
# numpy >= 2.3 ships stubs with 3.12-only syntax, so mypy cannot target 3.10;
# the 3.10 floor is held by ruff's target-version and a 3.10 test run instead.
python_version = "3.12"
ignore_missing_imports = true
